openapi: 3.1.0
info:
  title: plugin-hub API
  description: >
    Loads Agent Plugins (https://agent-plugins.org/) from configured zip
    sources, validates them against the Agent Plugins v1.0.0 specification,
    and serves them as a JSON API. A source's zip may either be a single
    plugin or a bundle of nested zips (recursively, to any depth), each of
    which is itself a plugin or another bundle.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      summary: List loaded plugins
      operationId: listPlugins
      parameters:
        - name: keyword
          in: query
          required: false
          description: Filter plugins to those whose keywords list contains all of the given values (case-insensitive). Repeat the parameter to require multiple keywords, e.g. `?keyword=mcp&keyword=companion`.
          schema:
            type: array
            items:
              type: string
          explode: true
      responses:
        "200":
          description: Full detail of every currently loaded plugin, including manifest, skills, and MCP servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plugin"
  /{name}:
    get:
      summary: Download a plugin's original zip archive
      operationId: downloadPlugin
      parameters:
        - name: name
          in: path
          required: true
          description: >-
            Plugin name with a `.zip` suffix, e.g. `my-plugin.zip` for the
            plugin named `my-plugin` in its `plugin.json` manifest.
          schema:
            type: string
      responses:
        "200":
          description: The plugin's original source zip file.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: No plugin with this name is loaded, or its archive is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reload:
    post:
      summary: Reload all sources
      description: >-
        Re-fetches every configured source and rebuilds the plugin list in
        the background. Also happens automatically on a timer; use this to
        trigger it immediately.
      operationId: reloadPlugins
      responses:
        "202":
          description: Reload has been started.
  /{name}/icon:
    get:
      summary: Download a plugin's icon
      operationId: downloadPluginIcon
      parameters:
        - name: name
          in: path
          required: true
          description: Plugin name, e.g. `my-plugin` for the plugin named `my-plugin` in its `plugin.json` manifest.
          schema:
            type: string
      responses:
        "200":
          description: The plugin's icon file (icon.png, icon.jpg, or icon.svg).
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No plugin with this name is loaded, or it has no icon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Plugin:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        homepage:
          type: string
        repository:
          type: string
        license:
          type: string
        keywords:
          type: array
          items:
            type: string
        extensions:
          type: object
          description: Vendor extension namespaces, each an arbitrary JSON object.
          additionalProperties:
            type: object
        source:
          type: string
          description: The source location (URL or path) this plugin was loaded from.
        icon:
          type: string
          description: Path to fetch this plugin's icon from, if it has one, e.g. `/my-plugin/icon`.
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        mcp:
          type: object
          description: MCP servers keyed by server name.
          additionalProperties:
            $ref: "#/components/schemas/MCPServer"
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal issues encountered while loading this plugin.

    Author:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        url:
          type: string

    Skill:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        license:
          type: string
        compatibility:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        allowedTools:
          type: string

    MCPServer:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [stdio, streamable-http, sse]
        command:
          type: string
          description: Required when type is "stdio".
        args:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        cwd:
          type: string
        url:
          type: string
          description: Required when type is "streamable-http" or "sse".
        headers:
          type: object
          additionalProperties:
            type: string
